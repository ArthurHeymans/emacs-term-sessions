name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        emacs-version: ['28.1', '29.4', '30.1']
    steps:
      - uses: actions/checkout@v7

      - uses: purcell/setup-emacs@v8.0
        with:
          version: ${{ matrix.emacs-version }}

      # MELPA acceptance checks: load-file, byte-compile, checkdoc and
      # package-lint, with the entry file as package main file.
      - uses: leotaku/elisp-check@v1.4.1
        with:
          check: melpa
          file: term-sessions.el

      - uses: leotaku/elisp-check@v1.4.1
        with:
          check: ert
          file: term-sessions-tests.el
